name: subturtle
description: Subturtle mobile app. Review, save and talk about the phrases you learn from what you watch.
publish_to: none
version: 1.0.0+2
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  subturtle_ui:
    path: ../../packages/subturtle_ui
  subturtle_api:
    path: ../../packages/subturtle_api
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  record: ^7.1.2
  wakelock_plus: ^1.8.1
  web_socket_channel: ^3.0.3
  package_info_plus: ^10.2.2
  flutter_pcm_sound: ^3.3.3
  webview_flutter: ^4.14.1
  sign_in_with_apple: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0
  stream_channel: ^2.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
