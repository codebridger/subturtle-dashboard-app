name: Agent E2E — Subscription tier ladder

# The agent-tests tier-ladder runbook (agent-tests/subscription/tier-ladder.spec.md),
# executed by its deterministic reference executor (server/scripts/e2e-tier-ladder.js)
# against a REAL Stripe test-mode account. Unlike the hermetic per-PR suites
# (Jest + Playwright in test.yml), this stands up the FULL stack — Mongo + the live
# server + `stripe listen` webhook forwarding — and proves the whole subscription
# lifecycle (subscribe → async webhook grant → enforcement → cancel → revert) wires
# together end to end.
#
# Triggers: a manual button + PRs into `main` (release PRs). Deliberately NOT on
# every dev PR — it's slow, async/webhook-driven, and touches a shared external
# account, so it gates the release branch rather than each feature.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

# Serialize: two runs must never hit the shared Stripe test account at once. Do NOT
# cancel-in-progress — killing a run mid-flight would orphan a live Stripe
# subscription past the executor's teardown step.
concurrency:
  group: agent-e2e-subscription
  cancel-in-progress: false

jobs:
  tier-ladder:
    name: Tier ladder (real Stripe test mode)
    runs-on: ubuntu-22.04
    # Skip for fork PRs: a pull_request from a fork can't read repo secrets, so the
    # run would fail spuriously. Manual runs and same-repo (release) PRs proceed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: server

    services:
      # Mongoose 5 sits squarely in MongoDB 5's support matrix; pair with node 18
      # below to avoid the handshake bug newer node/server combos trigger.
      mongo:
        image: mongo:5
        ports:
          - 27017:27017

    env:
      # Server boot (server/src/index.ts): Mongo address + the dev DB prefix the
      # executor's mongosh queries hardcode (→ subturtle_dev_user_content). PORT
      # defaults to 8080 in index.ts.
      MONGO_BASE_ADDRESS: mongodb://localhost:27017
      MONGO_DB_PREFIX: subturtle_dev_
      # Real Stripe TEST secret (sk_test_…) — create this repo secret before first run.
      # STRIPE_WEBHOOK_SECRET is intentionally left UNSET so the webhook handler
      # accepts the unverified payloads `stripe listen` forwards (dev path).
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      # Private @codebridger packages (GitHub Packages) — same token test.yml uses.
      GIGET_AUTH_TOKEN: ${{ secrets.GIGET_AUTH_TOKEN }}
      # Dummy values for keys only touched by lazily-invoked provider modules
      # (Gemini / OpenAI / Google / TTS). The executor exercises only subscription +
      # auth paths, and the gated live-session RPC blocks BEFORE any provider call —
      # these non-empty placeholders just keep module construction from throwing at
      # boot. If the server log shows a real missing-key boot failure, promote the
      # relevant one to a secret.
      GEMINI_API_KEY: ci-dummy
      GCP_API_KEY: ci-dummy
      OPENAI_API_KEY: ci-dummy
      OPENROUTER_API_KEY: ci-dummy
      GOOGLE_OAUTH_CLIENT_ID: ci-dummy
      GOOGLE_OAUTH_CLIENT_ID_EXTENSION: ci-dummy
      GOOGLE_OAUTH_CLIENT_SECRET: ci-dummy
      MIXPANEL_TOKEN: ci-dummy

    steps:
      - uses: actions/checkout@v4

      # The server RUNTIME needs node 16–18 (node 22 breaks the Mongoose-5
      # handshake); the executor needs ≥18. node 18 is the intersection — NOT
      # server/.nvmrc (22, which is only safe for tsc/Jest, not for running the server).
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
          cache-dependency-path: server/yarn.lock

      - name: Authenticate private registry
        run: |
          echo "@codebridger:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${GIGET_AUTH_TOKEN}" >> .npmrc

      - name: Install mongosh (the executor shells out to it for seed/teardown)
        run: |
          curl -fsSL https://pgp.mongodb.com/server-7.0.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/mongodb.gpg
          echo "deb [ signed-by=/usr/share/keyrings/mongodb.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh

      - name: Install Stripe CLI
        run: |
          asset="$(curl -fsSL https://api.github.com/repos/stripe/stripe-cli/releases/latest \
            | grep -o 'https://[^"]*linux_x86_64.tar.gz' | head -1)"
          curl -fsSL "$asset" -o /tmp/stripe.tar.gz
          tar -xzf /tmp/stripe.tar.gz -C /tmp stripe
          sudo mv /tmp/stripe /usr/local/bin/stripe
          stripe --version

      - name: Install deps + build server
        run: |
          yarn install --frozen-lockfile
          yarn build

      # modular-rest signs JWTs with an RSA keypair; index.ts#getKeys() falls back to
      # server/keys/{private,public}.pem. Generate an ephemeral pair per run — the same
      # server issues and verifies the executor's token, so a throwaway key is fine.
      - name: Generate ephemeral JWT keypair
        run: |
          mkdir -p keys
          openssl genrsa -out keys/private.pem 2048
          openssl rsa -in keys/private.pem -pubout -out keys/public.pem

      - name: Seed Stripe products (display + entitlement metadata)
        run: yarn setup:stripe

      - name: Start server (background)
        run: |
          node dist/index.js > server.log 2>&1 &
          echo $! > server.pid
          npx --yes wait-on tcp:127.0.0.1:8080 -t 90000

      - name: Forward Stripe webhooks (background)
        run: |
          stripe listen --api-key "$STRIPE_SECRET_KEY" \
            --forward-to localhost:8080/gateway/webhook/stripe > stripe.log 2>&1 &
          echo $! > stripe.pid
          # Wait for the CLI to print "Ready!" — it must be tunneling before the
          # executor drives Stripe, or the grant webhooks would be missed.
          for i in $(seq 1 30); do grep -qi "ready" stripe.log && break; sleep 1; done
          cat stripe.log

      - name: Run tier-ladder executor
        run: node scripts/e2e-tier-ladder.js

      - name: Upload run report + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-e2e-subscription
          # Paths are relative to the workspace root (not the working-directory).
          path: |
            agent-tests/_runs/
            server/server.log
            server/stripe.log
          retention-days: 14
