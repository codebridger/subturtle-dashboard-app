name: Deploy dev

# Every push to dev goes to the subturtle-dev Firebase project (see deploy.yml), once the full
# test suite passes on the pushed commit.

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  deploy:
    needs: test
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
